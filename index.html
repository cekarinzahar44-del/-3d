<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0612">
<title>Stack Tower 3D</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body {
    width:100%; height:100%; overflow:hidden;
    background:#0a0612;
    color:#fff;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    user-select:none;
    touch-action:none;
  }
  canvas { display:block; position:fixed; inset:0; z-index:0; }
  button { font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
  .hidden { display:none !important; }

  /* ═════════ ФОН (CSS — гарантированно работает) ═════════ */
  #bg {
    position:fixed; inset:0; z-index:-1;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(255,90,160,0.30) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 90%, rgba(110,90,255,0.25) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, #2a0e4a 0%, #0a0612 70%);
  }
  #vignette {
    position:fixed; inset:0; z-index:3;
    pointer-events:none;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.5) 100%);
  }

  /* ═════════ HUD ═════════ */
  #hud-top {
    position:fixed; top:0; left:0; right:0; z-index:5;
    padding: max(20px, env(safe-area-inset-top)) 24px 0;
    pointer-events:none;
    text-align:center;
  }
  #score {
    font-size:84px; font-weight:900; color:#fff;
    line-height:0.95;
    text-shadow: 0 4px 30px rgba(0,0,0,0.5), 0 0 50px rgba(255,255,255,0.15);
    letter-spacing:-2px;
    transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  #score.bump { transform: scale(1.18); }
  #score.perfect {
    color: #ffe066;
    text-shadow: 0 4px 30px rgba(0,0,0,0.5), 0 0 60px rgba(255,224,102,0.8);
  }
  #best {
    font-size:12px; font-weight:600; color:rgba(255,255,255,0.6);
    margin-top:8px; letter-spacing:2px; text-transform:uppercase;
  }
  #combo {
    position:fixed; top:50%; left:50%;
    transform:translate(-50%, -50%);
    font-size:120px; font-weight:900; color:#ffe066;
    text-shadow: 0 0 80px rgba(255,224,102,0.8);
    opacity:0; pointer-events:none; z-index:6;
    letter-spacing:-4px;
  }
  #combo.show { animation: combo-pop 0.9s ease-out forwards; }
  @keyframes combo-pop {
    0%   { opacity:0; transform:translate(-50%, -30%) scale(0.5); }
    20%  { opacity:1; transform:translate(-50%, -50%) scale(1.1); }
    40%  { transform:translate(-50%, -50%) scale(1); }
    100% { opacity:0; transform:translate(-50%, -70%) scale(0.95); }
  }

  /* ═════════ СТАРТОВЫЙ ЭКРАН ═════════ */
  #start {
    position:fixed; inset:0; z-index:200;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:40px 24px;
    background: radial-gradient(ellipse at center, rgba(10,6,18,0.4) 0%, rgba(10,6,18,0.85) 100%);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: opacity 0.5s, transform 0.5s;
  }
  #start.hide { opacity:0; pointer-events:none; transform:scale(1.05); }
  .logo-stack {
    display:flex; flex-direction:column; gap:6px; align-items:center;
    margin-bottom:30px;
  }
  .logo-block {
    width:120px; height:18px; border-radius:3px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.3), inset 0 -3px 0 rgba(0,0,0,0.15);
    animation: stack-in 1.5s ease-in-out infinite;
  }
  .logo-block:nth-child(1) { background:linear-gradient(135deg, #ff5e9c, #ff7eb3); animation-delay:0s; }
  .logo-block:nth-child(2) { background:linear-gradient(135deg, #c065ff, #d989ff); animation-delay:0.2s; }
  .logo-block:nth-child(3) { background:linear-gradient(135deg, #5e9cff, #7eb3ff); animation-delay:0.4s; }
  .logo-block:nth-child(4) { background:linear-gradient(135deg, #5eddff, #7eebff); animation-delay:0.6s; }
  @keyframes stack-in {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  #start h1 {
    font-size:42px; font-weight:900;
    letter-spacing:-1px;
    background: linear-gradient(135deg, #fff, #ffe066);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom:6px;
  }
  #start .sub {
    font-size:12px; letter-spacing:6px;
    color:rgba(255,255,255,0.6);
    text-transform:uppercase;
    margin-bottom:36px;
  }
  .play-btn {
    padding: 18px 56px;
    background: linear-gradient(135deg, #ff5e9c, #c065ff);
    border-radius:50px;
    color:#fff; font-size:18px; font-weight:700;
    letter-spacing:2px; text-transform:uppercase;
    box-shadow: 0 12px 40px rgba(255,94,156,0.4), inset 0 -3px 0 rgba(0,0,0,0.15);
    transition: transform 0.15s;
  }
  .play-btn:active { transform: scale(0.95) translateY(2px); }
  .hint {
    margin-top:30px;
    font-size:13px; letter-spacing:1px;
    color:rgba(255,255,255,0.55);
    text-align:center; max-width:280px; line-height:1.6;
  }
  .stat-row { margin-top:34px; display:flex; gap:30px; }
  .stat { text-align:center; }
  .stat-val {
    font-size:32px; font-weight:900;
    background: linear-gradient(135deg, #ffe066, #ff8e6e);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .stat-label {
    font-size:10px; letter-spacing:2px;
    color:rgba(255,255,255,0.5);
    text-transform:uppercase;
    margin-top:4px;
  }

  /* ═════════ ЭКРАН КОНЦА ═════════ */
  #gameover {
    position:fixed; inset:0; z-index:300;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:40px 24px;
    background: radial-gradient(ellipse at center, rgba(10,6,18,0.7) 0%, rgba(10,6,18,0.95) 100%);
    backdrop-filter: blur(8px);
    opacity:0; pointer-events:none;
    transition: opacity 0.5s;
  }
  #gameover.show { opacity:1; pointer-events:auto; }
  .go-title {
    font-size:48px; font-weight:900;
    background: linear-gradient(135deg, #ff5e9c, #c065ff);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom:30px;
    letter-spacing:-1px;
  }
  .score-card {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius:24px;
    padding:30px 50px;
    text-align:center;
    margin-bottom:14px;
    min-width:240px;
  }
  .sc-label {
    font-size:11px; letter-spacing:3px;
    color:rgba(255,255,255,0.5);
    text-transform:uppercase;
    margin-bottom:8px;
  }
  .sc-val { font-size:60px; font-weight:900; color:#fff; line-height:1; }
  .sc-val.gold {
    background: linear-gradient(135deg, #ffe066, #ff8e6e);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .new-best {
    font-size:12px; font-weight:700;
    color:#ffe066;
    letter-spacing:2px;
    margin-top:6px;
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity:0.7; }
    50% { opacity:1; }
  }

  /* ═════════ ERROR-BANNER ═════════ */
  #err {
    position:fixed; top:20px; left:20px; right:20px;
    z-index:9999; padding:14px 18px;
    background:#3a0d0d; border:1px solid #e85a4f;
    border-radius:12px; font-size:13px;
    display:none;
  }
  #err.show { display:block; }
</style>
</head>
<body>

<div id="bg"></div>
<canvas id="canvas"></canvas>
<div id="vignette"></div>

<div id="err"></div>

<div id="hud-top" class="hidden">
  <div id="score">0</div>
  <div id="best">BEST 0</div>
</div>

<div id="combo"></div>

<div id="start">
  <div class="logo-stack">
    <div class="logo-block"></div>
    <div class="logo-block"></div>
    <div class="logo-block"></div>
    <div class="logo-block"></div>
  </div>
  <h1>STACK TOWER</h1>
  <div class="sub">3D · Endless</div>
  <button class="play-btn" id="play-btn">PLAY</button>
  <div class="hint">Тапни в нужный момент,<br>чтобы блок упал точно на башню.</div>
  <div class="stat-row">
    <div class="stat">
      <div class="stat-val" id="startBest">0</div>
      <div class="stat-label">Лучший</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="startGames">0</div>
      <div class="stat-label">Игр</div>
    </div>
  </div>
</div>

<div id="gameover">
  <div class="go-title">GAME OVER</div>
  <div class="score-card">
    <div class="sc-label">Счёт</div>
    <div class="sc-val" id="goScore">0</div>
  </div>
  <div class="score-card">
    <div class="sc-label">Лучший</div>
    <div class="sc-val gold" id="goBest">0</div>
    <div class="new-best hidden" id="newBest">★ НОВЫЙ РЕКОРД</div>
  </div>
  <button class="play-btn" id="restart-btn" style="margin-top:14px;">PLAY AGAIN</button>
</div>

<script>
(function() {
  'use strict';

  function showError(msg) {
    const el = document.getElementById('err');
    if (el) { el.textContent = '⚠ ' + msg; el.classList.add('show'); }
    console.error(msg);
  }

  // Глобальный отлов ошибок — увидим их даже без DevTools
  window.addEventListener('error', e => showError(e.message + ' (' + (e.filename || '') + ':' + (e.lineno || '?') + ')'));
  window.addEventListener('unhandledrejection', e => showError('Promise: ' + (e.reason?.message || e.reason)));

  if (typeof THREE === 'undefined') {
    showError('Three.js не загрузился с CDN');
    return;
  }

  // ════════ TELEGRAM ════════
  try {
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
      if (tg.setHeaderColor) tg.setHeaderColor('#0a0612');
      if (tg.setBackgroundColor) tg.setBackgroundColor('#0a0612');
    }
  } catch (e) { console.warn('TG init:', e); }

  // ════════ ENGINE ════════
  const canvas = document.getElementById('canvas');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.setClearColor(0x000000, 0); // прозрачный — виден CSS-фон

  const scene = new THREE.Scene();

  const aspect = window.innerWidth / window.innerHeight;
  const camera = new THREE.OrthographicCamera(-8 * aspect, 8 * aspect, 8, -8, 0.1, 100);
  camera.position.set(8, 10, 8);
  camera.lookAt(0, 0, 0);
  let cameraLookY = 0;

  // ════════ ОСВЕЩЕНИЕ ════════
  scene.add(new THREE.AmbientLight(0xffffff, 0.55));

  const keyLight = new THREE.DirectionalLight(0xffffff, 0.9);
  keyLight.position.set(8, 18, 8);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.width = 1024;
  keyLight.shadow.mapSize.height = 1024;
  keyLight.shadow.camera.near = 0.5;
  keyLight.shadow.camera.far = 60;
  keyLight.shadow.camera.left = -12;
  keyLight.shadow.camera.right = 12;
  keyLight.shadow.camera.top = 25;
  keyLight.shadow.camera.bottom = -15;
  keyLight.shadow.bias = -0.0005;
  scene.add(keyLight);

  const rimLight = new THREE.DirectionalLight(0xff5e9c, 0.5);
  rimLight.position.set(-8, 8, -6);
  scene.add(rimLight);

  const fillLight = new THREE.DirectionalLight(0x6ab0ff, 0.35);
  fillLight.position.set(6, 4, -8);
  scene.add(fillLight);

  // ════════ АНИМАЦИИ ════════
  let pendingAnims = [];
  function addAnim(fn) { pendingAnims.push(fn); }
  function clearAnims() { pendingAnims = []; }

  function moveCameraY(targetY, dur) {
    dur = dur || 0.4;
    const startY = camera.position.y;
    const startLookY = cameraLookY;
    const targetLookY = targetY - 10;
    let t = 0;
    addAnim(dt => {
      t = Math.min(t + dt / dur, 1);
      const e = 1 - Math.pow(1 - t, 3);
      camera.position.y = startY + (targetY - startY) * e;
      cameraLookY = startLookY + (targetLookY - startLookY) * e;
      camera.lookAt(0, cameraLookY, 0);
      return t >= 1;
    });
  }

  function resetCamera() {
    camera.position.set(8, 10, 8);
    cameraLookY = 0;
    camera.lookAt(0, 0, 0);
  }

  // ════════ ЧАСТИЦЫ ════════
  function particleBurst(x, y, z, color) {
    for (let i = 0; i < 10; i++) {
      const geo = new THREE.BoxGeometry(0.15, 0.15, 0.15);
      const mat = new THREE.MeshStandardMaterial({
        color, emissive: color, emissiveIntensity: 0.5,
        transparent: true, opacity: 1
      });
      const p = new THREE.Mesh(geo, mat);
      p.position.set(x, y, z);
      scene.add(p);
      const a = (i / 10) * Math.PI * 2;
      const vx = Math.cos(a) * (2 + Math.random() * 2);
      const vz = Math.sin(a) * (2 + Math.random() * 2);
      let vy = 2 + Math.random() * 2;
      let t = 0;
      addAnim(dt => {
        t += dt;
        p.position.x += vx * dt;
        p.position.y += vy * dt;
        p.position.z += vz * dt;
        vy -= 18 * dt;
        p.rotation.x += dt * 8;
        p.rotation.z += dt * 6;
        mat.opacity = Math.max(0, 1 - t / 0.8);
        if (t >= 0.8) {
          scene.remove(p);
          geo.dispose(); mat.dispose();
          return true;
        }
        return false;
      });
    }
  }

  function shockwave(x, y, z, color) {
    const geo = new THREE.RingGeometry(0.1, 0.5, 32);
    const mat = new THREE.MeshBasicMaterial({
      color, transparent: true, opacity: 0.8,
      side: THREE.DoubleSide, depthWrite: false
    });
    const ring = new THREE.Mesh(geo, mat);
    ring.rotation.x = -Math.PI / 2;
    ring.position.set(x, y + 0.1, z);
    scene.add(ring);
    let t = 0;
    addAnim(dt => {
      t += dt;
      const k = t / 0.6;
      const s = 1 + k * 8;
      ring.scale.set(s, s, 1);
      mat.opacity = 0.8 * (1 - k);
      if (t >= 0.6) {
        scene.remove(ring);
        geo.dispose(); mat.dispose();
        return true;
      }
      return false;
    });
  }

  // ════════ ИГРА ════════
  const BLOCK_H = 0.6;
  const BASE_SIZE = 4;
  const SPEED_BASE = 4.5;
  const SPEED_INC = 0.12;
  const SPEED_MAX = 9;
  const PERFECT_THR = 0.08;

  let blocks = [];
  let movingBlock = null;
  let moveAxis = 'x';
  let moveDir = 1;
  let moveSpeed = SPEED_BASE;
  let score = 0;
  let combo = 0;
  let gameOver = false;
  let allowInput = false;

  let stats = { best: 0, games: 0 };
  try {
    const s = localStorage.getItem('stack3d_v2');
    if (s) stats = Object.assign(stats, JSON.parse(s));
  } catch (e) {}
  function saveStats() {
    try { localStorage.setItem('stack3d_v2', JSON.stringify(stats)); } catch (e) {}
  }

  function blockColor(idx) {
    const hue = (200 + idx * 8) % 360;
    return new THREE.Color().setHSL(hue / 360, 0.65, 0.6);
  }

  function makeBlock(size, position, color) {
    const geo = new THREE.BoxGeometry(size.x, size.y, size.z);
    const mat = new THREE.MeshStandardMaterial({
      color, roughness: 0.3, metalness: 0.15,
      emissive: color.clone().multiplyScalar(0.12),
      emissiveIntensity: 1
    });
    const m = new THREE.Mesh(geo, mat);
    m.position.copy(position);
    m.castShadow = true;
    m.receiveShadow = true;
    return m;
  }

  function dropPiece(size, position, color, velocity) {
    const piece = makeBlock(size, position, color);
    scene.add(piece);
    let vy = 0;
    const vRot = (Math.random() - 0.5) * 4;
    let t = 0;
    addAnim(dt => {
      t += dt;
      vy -= 18 * dt;
      piece.position.y += vy * dt;
      piece.position.x += velocity.x * dt;
      piece.position.z += velocity.z * dt;
      piece.rotation.z += vRot * dt;
      piece.rotation.x += vRot * 0.5 * dt;
      if (piece.position.y < -15 || t > 5) {
        scene.remove(piece);
        piece.geometry.dispose();
        piece.material.dispose();
        return true;
      }
      return false;
    });
  }

  function startGame() {
    document.getElementById('start').classList.add('hide');
    document.getElementById('gameover').classList.remove('show');
    document.getElementById('hud-top').classList.remove('hidden');

    // Очистка
    blocks.forEach(b => {
      scene.remove(b);
      b.geometry.dispose();
      b.material.dispose();
    });
    blocks = [];
    if (movingBlock) {
      scene.remove(movingBlock);
      movingBlock.geometry.dispose();
      movingBlock.material.dispose();
      movingBlock = null;
    }
    clearAnims();
    resetCamera();
    score = 0;
    combo = 0;
    moveSpeed = SPEED_BASE;
    gameOver = false;
    allowInput = false;
    updateScoreUI();

    // База
    const baseColor = blockColor(0);
    const baseBlock = makeBlock(
      { x: BASE_SIZE, y: BLOCK_H * 3, z: BASE_SIZE },
      new THREE.Vector3(0, -BLOCK_H * 1.5, 0),
      baseColor
    );
    baseBlock.userData = { size: { x: BASE_SIZE, y: BLOCK_H * 3, z: BASE_SIZE } };
    scene.add(baseBlock);
    blocks.push(baseBlock);

    spawnNext();
  }

  function spawnNext() {
    const last = blocks[blocks.length - 1];
    const lastSize = last.userData.size;
    const lastY = last.position.y + lastSize.y / 2;

    moveAxis = (blocks.length % 2 === 1) ? 'x' : 'z';
    moveDir = 1;

    const newSize = { x: lastSize.x, y: BLOCK_H, z: lastSize.z };
    const pos = new THREE.Vector3(last.position.x, lastY + BLOCK_H / 2, last.position.z);
    if (moveAxis === 'x') pos.x = -6;
    else pos.z = -6;

    movingBlock = makeBlock(newSize, pos, blockColor(blocks.length));
    movingBlock.userData = { size: Object.assign({}, newSize) };
    scene.add(movingBlock);

    if (blocks.length > 3) {
      moveCameraY(blocks.length * BLOCK_H + 9, 0.4);
    }

    allowInput = true;
    addAnim(dt => {
      if (!movingBlock || gameOver) return true;
      if (moveAxis === 'x') {
        movingBlock.position.x += moveDir * moveSpeed * dt;
        if (movingBlock.position.x > 6) moveDir = -1;
        if (movingBlock.position.x < -6) moveDir = 1;
      } else {
        movingBlock.position.z += moveDir * moveSpeed * dt;
        if (movingBlock.position.z > 6) moveDir = -1;
        if (movingBlock.position.z < -6) moveDir = 1;
      }
      return false;
    });
  }

  function placeBlock() {
    if (!allowInput || gameOver || !movingBlock) return;
    allowInput = false;

    const last = blocks[blocks.length - 1];
    const lastSize = last.userData.size;
    const movSize = movingBlock.userData.size;

    const ax = moveAxis;
    const diff = ax === 'x' ? movingBlock.position.x - last.position.x : movingBlock.position.z - last.position.z;
    const movDim = ax === 'x' ? movSize.x : movSize.z;
    const overlap = movDim - Math.abs(diff);

    if (overlap <= 0) { missEnd(); return; }

    const isPerfect = Math.abs(diff) < PERFECT_THR;

    if (isPerfect) {
      // Выровнять
      if (ax === 'x') movingBlock.position.x = last.position.x;
      else movingBlock.position.z = last.position.z;
      combo++;
      score += 5;
      showCombo();
      particleBurst(movingBlock.position.x, movingBlock.position.y, movingBlock.position.z, movingBlock.material.color);
      shockwave(movingBlock.position.x, movingBlock.position.y - movSize.y / 2, movingBlock.position.z, movingBlock.material.color);

      // Растим обратно каждые 3 perfect
      if (combo > 0 && combo % 3 === 0) {
        const lastDim = ax === 'x' ? lastSize.x : lastSize.z;
        const grow = Math.min(0.4, BASE_SIZE - movDim);
        if (grow > 0.01) {
          if (ax === 'x') {
            const newSize = movSize.x + grow;
            movingBlock.geometry.dispose();
            movingBlock.geometry = new THREE.BoxGeometry(newSize, movSize.y, movSize.z);
            movingBlock.userData.size.x = newSize;
          } else {
            const newSize = movSize.z + grow;
            movingBlock.geometry.dispose();
            movingBlock.geometry = new THREE.BoxGeometry(movSize.x, movSize.y, newSize);
            movingBlock.userData.size.z = newSize;
          }
        }
      }
    } else {
      combo = 0;
      // Обрезка
      if (ax === 'x') {
        const newCenter = (Math.max(movingBlock.position.x - movSize.x/2, last.position.x - lastSize.x/2) +
                          Math.min(movingBlock.position.x + movSize.x/2, last.position.x + lastSize.x/2)) / 2;
        const dropDim = movSize.x - overlap;
        const dropX = diff > 0
          ? newCenter + overlap/2 + dropDim/2
          : newCenter - overlap/2 - dropDim/2;
        dropPiece(
          { x: dropDim, y: movSize.y, z: movSize.z },
          new THREE.Vector3(dropX, movingBlock.position.y, movingBlock.position.z),
          movingBlock.material.color,
          { x: diff > 0 ? 2 : -2, z: 0 }
        );
        movingBlock.geometry.dispose();
        movingBlock.geometry = new THREE.BoxGeometry(overlap, movSize.y, movSize.z);
        movingBlock.position.x = newCenter;
        movingBlock.userData.size.x = overlap;
      } else {
        const newCenter = (Math.max(movingBlock.position.z - movSize.z/2, last.position.z - lastSize.z/2) +
                          Math.min(movingBlock.position.z + movSize.z/2, last.position.z + lastSize.z/2)) / 2;
        const dropDim = movSize.z - overlap;
        const dropZ = diff > 0
          ? newCenter + overlap/2 + dropDim/2
          : newCenter - overlap/2 - dropDim/2;
        dropPiece(
          { x: movSize.x, y: movSize.y, z: dropDim },
          new THREE.Vector3(movingBlock.position.x, movingBlock.position.y, dropZ),
          movingBlock.material.color,
          { x: 0, z: diff > 0 ? 2 : -2 }
        );
        movingBlock.geometry.dispose();
        movingBlock.geometry = new THREE.BoxGeometry(movSize.x, movSize.y, overlap);
        movingBlock.position.z = newCenter;
        movingBlock.userData.size.z = overlap;
      }
      score += 1;
    }

    blocks.push(movingBlock);
    movingBlock = null;
    updateScoreUI();
    moveSpeed = Math.min(SPEED_MAX, SPEED_BASE + score * SPEED_INC);

    setTimeout(() => { if (!gameOver) spawnNext(); }, 150);
  }

  function missEnd() {
    if (movingBlock) {
      const movSize = movingBlock.userData.size;
      const vx = moveAxis === 'x' ? moveDir * 1.5 : 0;
      const vz = moveAxis === 'z' ? moveDir * 1.5 : 0;
      dropPiece(
        movSize,
        movingBlock.position.clone(),
        movingBlock.material.color,
        { x: vx, z: vz }
      );
      scene.remove(movingBlock);
      movingBlock.geometry.dispose();
      movingBlock.material.dispose();
      movingBlock = null;
    }

    gameOver = true;
    allowInput = false;
    stats.games++;
    const newBest = score > stats.best;
    if (newBest) stats.best = score;
    saveStats();

    setTimeout(() => {
      document.getElementById('hud-top').classList.add('hidden');
      document.getElementById('goScore').textContent = score;
      document.getElementById('goBest').textContent = stats.best;
      const nbEl = document.getElementById('newBest');
      if (newBest) nbEl.classList.remove('hidden');
      else nbEl.classList.add('hidden');
      document.getElementById('gameover').classList.add('show');
    }, 1000);
  }

  function updateScoreUI() {
    const el = document.getElementById('score');
    el.textContent = score;
    el.classList.remove('bump', 'perfect');
    void el.offsetWidth;
    el.classList.add('bump');
    if (combo > 0) el.classList.add('perfect');
    document.getElementById('best').textContent = 'BEST ' + stats.best;
  }

  function showCombo() {
    if (combo < 2) return;
    const el = document.getElementById('combo');
    el.textContent = 'PERFECT ×' + combo;
    el.classList.remove('show');
    void el.offsetWidth;
    el.classList.add('show');
  }

  function updateStartScreen() {
    document.getElementById('startBest').textContent = stats.best;
    document.getElementById('startGames').textContent = stats.games;
  }
  updateStartScreen();

  // ════════ RENDER LOOP ════════
  let lastT = performance.now();
  function loop() {
    requestAnimationFrame(loop);
    const now = performance.now();
    const dt = Math.min((now - lastT) / 1000, 0.05);
    lastT = now;
    if (pendingAnims.length) {
      pendingAnims = pendingAnims.filter(fn => !fn(dt));
    }
    renderer.render(scene, camera);
  }
  loop();

  // ════════ RESIZE ════════
  window.addEventListener('resize', () => {
    const a = window.innerWidth / window.innerHeight;
    camera.left = -8 * a;
    camera.right = 8 * a;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ════════ INPUT ════════
  document.getElementById('play-btn').addEventListener('click', startGame);
  document.getElementById('restart-btn').addEventListener('click', startGame);

  function handleTap(e) {
    if (e.target.closest('button')) return;
    if (!document.getElementById('start').classList.contains('hide')) return;
    if (document.getElementById('gameover').classList.contains('show')) return;
    placeBlock();
  }
  document.addEventListener('touchstart', handleTap, { passive: true });
  document.addEventListener('mousedown', e => { if (e.button === 0) handleTap(e); });

  console.log('Stack Tower 3D: ready');
})();
</script>
</body>
</html>
